[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explorer-workbook"
version = "0.1.0"
description = "Generates a printable children's travel activity workbook for any destination, as data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed for `--pdf`; `--html` and everything else is stdlib-only.
pdf = ["playwright>=1.40,<2"]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["src*"]
